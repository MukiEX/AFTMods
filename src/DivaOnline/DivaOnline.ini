; DivaOnline.ini: goes next to DivaOnline.dva in the game's plugins folder.
; Sections and keys are segatools.ini's (TeamTofuShop/segatools, divahook), so a working
; segatools.ini can be pasted in; [divaonline] is DivaOnline's own.
; Relative paths (DEVICE\...) are relative to the game folder, where diva.exe is.

[divaonline]
enable=1
; Put back the card screen if PD Loader's [patches] quick_start skips it
undo_quick_start=1
; Also put back the parts of the startup network check PD Loader always shortens
; (skip, DHCP wait, location server). Try this if the network check fails.
undo_network_patches=0
; Also put back the two checks PD Loader always skips ("skip unnecessary checks").
; Keep at 0: with them back the game ignores START on the title screen.
undo_keychip_patches=0
; Copy the game's own ALL.Net library messages ("[ALL.Net] ...") into this log
allnet_log=1
; Copy the game's own debug messages for these categories (bit mask) into this log.
; 0x10000 = the Aime reader task. 0 turns it off.
game_log=0x10000
; Load DivaLinux.dva before installing hooks (its file layer has to come first)
preload_divalinux=1
; Write the log to a file as well as PD Loader's console, e.g. DivaOnline.log
log_file=

; ------------------------------------------------------------------ Aime card
[aime]
enable=1
; Your card: the 20-digit access code (spaces or dashes allowed)
accessCode=
; ...or a FeliCa card's IDm (16 hex digits), used when accessCode is empty
felicaIdm=
; Key that holds the card on the reader: a name (Insert, Enter, F3, C, Numpad0)
; or a virtual-key code (0x2D). Not Enter: TLAC uses it for START.
scan=Insert
; 1 = the card is always on the reader (no key needed; for controller-only setups)
autoInsert=0
; With no accessCode/felicaIdm, the card is read from segatools' files instead:
;aimePath=DEVICE\aime.txt
;felicaPath=DEVICE\felica.txt
;felicaGen=0

[aimeio]
; A segatools aimeio DLL for a real card reader. When set, [aime] above is ignored
; and the DLL reads its own settings (usually from segatools.ini in the game folder).
path=

; ------------------------------------------------------------------- ALL.Net
[dns]
; Your ARTEMiS server's host name or IP address
default=127.0.0.1
; Per-service overrides, each defaulting to the above:
;startup=      ; naominet.jp (ALL.Net)
;billing=      ; ib.naominet.jp
;aimedb=       ; aime.naominet.jp
;router=       ; tenporouter.loc, bbrouter.loc

[keychip]
; Keychip serial the server sees. ARTEMiS accepts unregistered serials by default
; (allow_unregistered_serials in core.yaml); a community server may want yours.
id=A69E-01A88888888
; The LAN ALL.Net thinks it's on (with [netenv]); Diva's is 192.168.78.0
subnet=192.168.78.0
;region=1
;billingCa=DEVICE\ca.crt
;billingPub=DEVICE\billing.pub

[netenv]
; Pretend to be on the LAN above, with a router that answers pings
enable=1
;addrSuffix=11
;routerSuffix=254
;macAddr=01:02:03:04:05:06

[pcbid]
;serialNo=ACAE01A99999999

[clock]
; Show the game JST, and stop ALL.Net from setting the PC's clock
timezone=1
timewarp=0
writeable=0

[vfs]
; The cabinet's drives. ALL.Net keeps its billing data on APPDATA (Y:\).
; Folders, relative to the game folder unless absolute.
enable=1
amfs=amfs
appdata=appdata
;option=

; ------------------------------------------- arcade board (AMEX) emulation
[ds]
enable=1
;region=1
;serialNo=AAVE-01A99999999

[eeprom]
enable=1
path=DEVICE\eeprom.bin

[sram]
enable=1
path=DEVICE\sram.bin

[gpio]
; The board's DIP switches and Test/Service buttons.
enable=1
; DIP switch 1 = distribution server: the cabinet starts as SATELLITE:MAIN and is
; its own location server. 0 makes it SATELLITE:SUB ("Location Server NG").
dipsw1=1
; Test and Service buttons (virtual-key codes): F4 and F5
sw1=0x73
sw2=0x74

[hwmon]
enable=1

[hwreset]
enable=1

[misc]
; Stops the game from shutting down or rebooting Windows
enable=1
